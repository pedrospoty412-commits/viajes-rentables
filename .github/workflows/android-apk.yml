# Compila el APK debug de Viajes Rentables en la nube (GitHub Actions),
# subiendo SOLO el zip del proyecto. No hay que subir 54 archivos sueltos
# ni respetar carpetas a mano: este workflow descomprime el zip en la nube
# y compila dentro de la carpeta que trae adentro.
#
# Repo limpio, solo 2 cosas en la raiz:
#   1. El zip: viajes-rentables-android.zip (o con (1) en el nombre, igual sirve)
#   2. Este archivo, creado en GitHub en: .github/workflows/android-apk.yml
#      (Add file > Create new file, escribe esa ruta y pega este contenido)
#
# Despues: Actions > Build debug APK > Run workflow, y descarga el APK
# desde Artifacts -> app-debug.
name: Build debug APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd /tmp
          curl -sSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Unzip project
        run: |
          ls -la
          unzip -o viajes-rentables-android*.zip
          ls -la viajes-rentables-android/

      - name: Build debug APK
        working-directory: viajes-rentables-android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: viajes-rentables-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
